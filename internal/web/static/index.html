<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>tock</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><span class="live" id="live" title="connecting"></span>tock</div>
  <nav class="nav" id="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="today" id="tab-today">Today<kbd>1</kbd></button>
    <button role="tab" data-view="week" id="tab-week">Week<kbd>2</kbd></button>
    <button role="tab" data-view="top" id="tab-top">Top<kbd>3</kbd></button>
    <button role="tab" data-view="inbox" id="tab-inbox">Inbox<span class="badge" id="inbox-count" hidden></span></button>
  </nav>
  <section class="cal" id="cal" aria-label="Calendar"></section>
  <section class="status" id="status" aria-label="Status" aria-live="polite"></section>
</aside>
<div class="page">
  <header class="bar" id="bar">
    <div class="datenav" id="datenav">
      <button class="icon" id="prev" aria-label="Previous">‹</button>
      <button class="date-label" id="date-label">Today</button>
      <button class="icon" id="next" aria-label="Next">›</button>
    </div>
    <div class="sess" id="sess" hidden></div>
  </header>
  <div class="banner" id="banner" role="status" hidden></div>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
