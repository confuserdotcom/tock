<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The day ring: a clock whose ring is the day split into deep (teal),
       shallow (blue) and distracted (red) time. gen.go draws the same. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282d"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body centred in the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#2c2e34" stroke-width="64"/>
  <path d="M512 262 A250 250 0 0 1 749.8 589.3" fill="none" stroke="#4fa89a" stroke-width="64" stroke-linecap="round"/>
  <path d="M711 663 A250 250 0 0 1 401 736" fill="none" stroke="#6f86b5" stroke-width="64" stroke-linecap="round"/>
  <path d="M318 671 A250 250 0 0 1 300 380" fill="none" stroke="#c9625a" stroke-width="64" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="512" y2="350" stroke="#e6e6e8" stroke-width="40" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="40" fill="#e6e6e8"/>
</svg>
