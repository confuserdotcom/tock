<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Each span is labelled when a day is read: your own tags first, then the rules, then the local model when it is sure; what is left goes to the inbox, and labelling an inbox entry writes a learned rule.">
<style>
  .bx { fill: #f7f7f8; stroke: #d8d8d8; }
  .hl { fill: #ffffff; stroke: #1b1f24; stroke-width: 1.2; }
  .net { fill: none; stroke: #b3423f; stroke-dasharray: 5 4; }
  .t { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1b1f24; }
  .s { font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b636e; }
  .k { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; letter-spacing: .06em; }
  .m { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5b636e; }
  .a { stroke: #7e828b; stroke-width: 1.4; fill: none; }
  .d { stroke-dasharray: 4 4; }
  .ah { fill: #7e828b; }
  .r { fill: #b3423f; }
  @media (prefers-color-scheme: dark) {
    .bx { fill: #16171a; stroke: #33373d; }
    .hl { fill: #0f1011; stroke: #e6e6e8; }
    .net { stroke: #d98078; }
    .t { fill: #e6e6e8; }
    .s, .m { fill: #8b8d93; }
    .k { fill: #8b8d93; }
    .a { stroke: #7d8088; }
    .ah { fill: #7d8088; }
    .r { fill: #d98078; }
  }
</style>
<defs>
  <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="ah" d="M0,1 L10,5 L0,9 z"/>
  </marker>
</defs>

  <text class="k" x="20" y="24">EVERY TIME A DAY IS READ, FOR EACH SPAN</text>
  <g transform="translate(0,30)">

  <rect class="bx" x="20" y="56" width="140" height="104" rx="8"/>
  <text class="t" x="36" y="84">A span</text>
  <text class="s" x="36" y="106">app, title, URL,</text>
  <text class="s" x="36" y="123">start and end,</text>
  <text class="s" x="36" y="140">no label stored</text>

  <rect class="hl" x="192" y="56" width="140" height="104" rx="8"/>
  <text class="k" x="208" y="80">1</text>
  <text class="t" x="208" y="100">Your tags</text>
  <text class="s" x="208" y="122">what you labelled</text>
  <text class="s" x="208" y="139">by hand</text>

  <rect class="hl" x="364" y="56" width="140" height="104" rx="8"/>
  <text class="k" x="380" y="80">2</text>
  <text class="t" x="380" y="100">Rules</text>
  <text class="m" x="380" y="122">rules.toml</text>
  <text class="m" x="380" y="139">learned.toml</text>

  <rect class="hl" x="536" y="56" width="140" height="104" rx="8"/>
  <text class="k" x="552" y="80">3</text>
  <text class="t" x="552" y="100">Local model</text>
  <text class="s" x="552" y="122">only when it is sure</text>
  <text class="s" x="552" y="139">of a label</text>

  <rect class="bx" x="708" y="56" width="140" height="104" rx="8"/>
  <text class="t" x="724" y="84">Inbox</text>
  <text class="s" x="724" y="106">what nothing</text>
  <text class="s" x="724" y="123">labelled, grouped</text>
  <text class="s" x="724" y="140">by app, site, title</text>

  <line class="a" x1="160" y1="108" x2="190" y2="108" marker-end="url(#h)"/>
  <line class="a" x1="332" y1="108" x2="362" y2="108" marker-end="url(#h)"/>
  <line class="a" x1="504" y1="108" x2="534" y2="108" marker-end="url(#h)"/>
  <line class="a" x1="676" y1="108" x2="706" y2="108" marker-end="url(#h)"/>

  <!-- the loops back -->
  <path class="a" d="M778,160 V230 H434 V162" marker-end="url(#h)"/>
  <text class="s" x="606" y="222" text-anchor="middle">tock tag writes a learned rule</text>
  <path class="a d" d="M262,56 V32 H606 V54" marker-end="url(#h)"/>
  <text class="s" x="434" y="24" text-anchor="middle">the model learns from your tags every 15 minutes</text>
  <text class="s" x="20" y="272">The first step that has a label for the span gives it; the rest are skipped.</text>
  </g>
</svg>
