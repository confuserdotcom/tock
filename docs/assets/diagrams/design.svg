<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="The tock design system: colour means a kind of time (deep teal, shallow blue, browsing mauve, neutral grey, distracting brick, unlabelled faint grey, away hatched); near-black and white neutrals with ink as the only accent; Inter for everything with tabular figures; 2, 6 and 8 px corners.">
<style>
  .bg { fill: #ffffff; stroke: #d8d8d8; }
  .t { font: 600 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1b1f24; }
  .s { font: 12.5px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b636e; }
  .k { font: 600 11px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; letter-spacing: .06em; }
  .n { font: 500 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1b1f24; font-feature-settings: "tnum"; }
  .big { font: 600 56px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1b1f24; letter-spacing: -.03em; }
  .good { font: 500 13px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2e7d4f; }
  .deep { fill: #32857a; } .shallow { fill: #4c6ba9; } .browse { fill: #8d589d; }
  .neutral { fill: #7e828b; } .distract { fill: #c64539; } .unl { fill: #d8d8d8; }
  .n1 { fill: #ffffff; stroke: #d8d8d8; } .n2 { fill: #f7f7f8; stroke: #d8d8d8; } .n3 { fill: #f1f1f3; stroke: #d8d8d8; }
  .n4 { fill: #5b636e; } .n5 { fill: #1b1f24; }
  .hatch line { stroke: #b0b3ba; stroke-width: 2; }
  .line { stroke: #ececec; }
  .shape { fill: #f1f1f3; stroke: #d8d8d8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0f1011; stroke: #33373d; }
    .t, .n, .big { fill: #e6e6e8; }
    .s, .k { fill: #8b8d93; }
    .good { fill: #6cc3a3; }
    .deep { fill: #4fa89a; } .shallow { fill: #6f86b5; } .browse { fill: #a07fb0; }
    .neutral { fill: #7d8088; } .distract { fill: #c9625a; } .unl { fill: #33373d; }
    .n1 { fill: #0f1011; stroke: #33373d; } .n2 { fill: #16171a; stroke: #33373d; } .n3 { fill: #1d2024; stroke: #33373d; }
    .n4 { fill: #8b8d93; } .n5 { fill: #e6e6e8; }
    .hatch line { stroke: #4a4d54; }
    .line { stroke: #26272b; }
    .shape { fill: #1d2024; stroke: #33373d; }
  }
</style>
<defs>
  <pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)" class="hatch"><line x1="0" y1="0" x2="0" y2="6"/></pattern>
</defs>
<rect class="bg" x="0.5" y="0.5" width="859" height="399" rx="8"/>

<text class="k" x="32" y="44">COLOUR MEANS A KIND OF TIME</text>
<g transform="translate(32,62)">
  <rect class="deep" width="100" height="44" rx="6"/><text class="t" x="0" y="66">Deep</text><text class="s" x="0" y="84">focused work</text>
  <rect class="shallow" x="114" width="100" height="44" rx="6"/><text class="t" x="114" y="66">Shallow</text><text class="s" x="114" y="84">mail, chat</text>
  <rect class="browse" x="228" width="100" height="44" rx="6"/><text class="t" x="228" y="66">Browsing</text><text class="s" x="228" y="84">reading around</text>
  <rect class="neutral" x="342" width="100" height="44" rx="6"/><text class="t" x="342" y="66">Neutral</text><text class="s" x="342" y="84">neither</text>
  <rect class="distract" x="456" width="100" height="44" rx="6"/><text class="t" x="456" y="66">Distracting</text><text class="s" x="456" y="84">counts against</text>
  <rect class="unl" x="570" width="100" height="44" rx="6"/><text class="t" x="570" y="66">Unlabelled</text><text class="s" x="570" y="84">in the inbox</text>
  <rect fill="url(#hp)" x="684" width="112" height="44" rx="6" class="n3"/><rect fill="url(#hp)" x="684" width="112" height="44" rx="6"/><text class="t" x="684" y="66">Away</text><text class="s" x="684" y="84">hatched</text>
</g>

<line class="line" x1="32" y1="176" x2="828" y2="176"/>

<text class="k" x="32" y="208">NEUTRALS · INK IS THE ONLY ACCENT</text>
<g transform="translate(32,224)">
  <rect class="n1" width="40" height="40" rx="6"/>
  <rect class="n2" x="48" width="40" height="40" rx="6"/>
  <rect class="n3" x="96" width="40" height="40" rx="6"/>
  <rect class="n4" x="144" width="40" height="40" rx="6"/>
  <rect class="n5" x="192" width="40" height="40" rx="6"/>
  <text class="s" x="0" y="64">background, panel, sunk, muted, ink</text>
  <text class="s" x="0" y="86">Dark first; light follows the system.</text>
</g>

<text class="k" x="330" y="208">TYPE · INTER, TABULAR FIGURES</text>
<g transform="translate(330,224)">
  <text class="big" x="0" y="52">80</text>
  <text class="good" x="86" y="30">+17</text>
  <text class="s" x="116" y="30">vs your usual Saturday</text>
  <text class="n" x="0" y="86">Focus time</text><text class="n" x="200" y="86" text-anchor="end">2h14</text>
  <text class="n" x="0" y="108">Longest block</text><text class="n" x="200" y="108" text-anchor="end">1h40</text>
  <text class="s" x="0" y="140">56 px score · 13 px body · 11 px labels</text>
</g>

<text class="k" x="620" y="208">SHAPES</text>
<g transform="translate(620,224)">
  <rect class="deep" width="70" height="14" rx="2"/><text class="s" x="80" y="11">2 px · bars</text>
  <rect class="shape" y="30" width="70" height="28" rx="6"/><text class="s" x="80" y="49">6 px · buttons</text>
  <rect class="shape" y="72" width="70" height="44" rx="8"/><text class="s" x="80" y="99">8 px · panels</text>
  <text class="s" x="0" y="140">Flat: hairlines, no shadows.</text>
</g>
</svg>
