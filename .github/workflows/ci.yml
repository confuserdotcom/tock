name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: CGO_ENABLED=0 go vet ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: test
        run: CGO_ENABLED=0 go test ./... -count=1
      - name: cross-build for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build ./...

  # Windows: the build and every test, natively. Tests of macOS/Linux-only
  # flows skip there with their reason (testfs.UnixOnly).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      - name: race
        run: go test -race ./internal/flock/... ./internal/paths/... -count=1

  # Data races: trackd's sources, the store and the notch runner all hand
  # values between goroutines. Includes the performance budget tests.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: test with the race detector
        run: CGO_ENABLED=1 go test -race ./... -count=1

  # Known vulnerabilities in the Go code and the modules it calls.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The workflows themselves: valid, and every action pinned to a commit.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actions pinned to a commit
        run: |
          bad=$(grep -nE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/*.yml | grep -vE 'uses: [^ ]+@[0-9a-f]{40}( |$)' || true)
          test -z "$bad" || { echo "pin these to a commit SHA:"; echo "$bad"; exit 1; }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: test and build the dashboard
        run: cd web && npm ci && npm test && npm run build
      - name: the committed build is current
        run: git diff --exit-code --stat internal/web/static

  # macOS 26 and 15 on Apple Silicon, and 15 on the last Intel
  # image: tock is only used day to day on the newest.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: build
        run: make build
      - name: test
        run: go test ./... -count=1
