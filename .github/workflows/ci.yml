name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: CGO_ENABLED=0 go vet ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: test
        run: CGO_ENABLED=0 go test ./... -count=1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: test and build the dashboard
        run: cd web && npm ci && npm test && npm run build
      - name: the committed build is current
        run: git diff --exit-code --stat internal/web/static

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: build
        run: make build
      - name: test
        run: go test ./... -count=1
