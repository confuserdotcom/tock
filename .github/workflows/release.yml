name: release

# Pushing a tag like v5.1.0 tests it, builds the Linux tarballs with
# make release, the source tarball and Homebrew formula with make formula,
# and publishes them as a GitHub release, with the tag's CHANGELOG.md
# section as notes. The dmg job adds the .dmg. Once brew installs the
# formula, the tap job puts it in the homebrew-tock tap (stable tags only,
# and only with a TAP_TOKEN secret; without one, copy tock.rb by hand).

on:
  push:
    tags: ['v*']

# Read-only by default; only the jobs that publish to the release get write.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # signs the build provenance (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # make src archives the tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test
        run: CGO_ENABLED=0 go test ./... -count=1
      - name: known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: notes
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }
      - name: build
        run: make release formula VERSION="$GITHUB_REF_NAME"
      # What is inside: every Go module the build uses, with its version and
      # hash (CycloneDX), listed in SHA256SUMS like the tarballs.
      - name: sbom
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -json -licenses=false -output "dist/tock-$GITHUB_REF_NAME.cdx.json" .
          cd dist && shasum -a 256 "tock-$GITHUB_REF_NAME.cdx.json" >> SHA256SUMS
      # Signed provenance: gh attestation verify <file> -R confuserdotcom/tock
      # proves a tarball was built by this workflow from this tag.
      - name: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
            dist/tock.rb
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS dist/tock.rb --clobber
          else
            # a tag with a dash (v5.4.0-rc1) is a pre-release, never "latest"
            set -- --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
            case "$GITHUB_REF_NAME" in *-*) set -- "$@" --prerelease ;; esac
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS dist/tock.rb "$@"
          fi

  # The .dmg, built on a Mac: tock.app with tock setup's files inside, for
  # Apple Silicon and Intel. It is not notarized (no Developer ID), so the
  # README explains Open Anyway.
  dmg:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: make dmg VERSION="$GITHUB_REF_NAME"
      - name: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tock-${{ github.ref_name }}.dmg
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/tock-$GITHUB_REF_NAME.dmg" "dist/tock-$GITHUB_REF_NAME.dmg.sha256" --clobber

  # The formula as a user gets it: build from the published source on a Mac,
  # then brew test runs tock version.
  brew:
    needs: release
    runs-on: macos-latest
    steps:
      - name: install from the release's formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p tock.rb -D "$RUNNER_TEMP"
          brew tap-new --no-git local/tock
          cp "$RUNNER_TEMP/tock.rb" "$(brew --repository)/Library/Taps/local/homebrew-tock/Formula/tock.rb"
          brew install --build-from-source local/tock/tock
          brew test local/tock/tock
          tock setup --check || true # nothing is set up on the runner: it only must run

  # The tested formula goes to the tap, so brew users get the release. A
  # pre-release (a dash in the tag) stays out. Needs a TAP_TOKEN secret: a
  # fine-grained token with Contents read and write on homebrew-tock only.
  tap:
    needs: brew
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::no TAP_TOKEN secret: copy the release's tock.rb to homebrew-tock by hand"
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p tock.rb -D "$RUNNER_TEMP"
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tock.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cp "$RUNNER_TEMP/tock.rb" Formula/tock.rb
          if git diff --quiet; then
            echo "the tap already has $GITHUB_REF_NAME"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "tock ${GITHUB_REF_NAME#v}"
          git push -q origin HEAD
